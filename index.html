<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Gauge</title>
<style>
  /* ============================================================
     SETUP: paste your Google Sheet "Publish to web" CSV link
     between the quotes in SHEET_CSV_URL below (in the <script>).
     ============================================================ */
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --line: #2a2f3a;
    --text: #f2f4f8;
    --muted: #9aa3b2;
    --left: #3b82f6;
    --right: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 18px 40px; }
  h1 { font-size: clamp(22px, 6vw, 30px); text-align: center; margin: 0 0 6px; line-height: 1.2; }
  .status { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 18px;
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.6);
    animation: pulse 2s infinite; }
  .dot.stale { background: #f59e0b; animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.6);} 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0);} 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0);} }
  .gauge-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 14px 14px; }
  svg { display: block; width: 100%; height: auto; }
  #needle { transform-origin: 150px 160px; transition: transform 1.6s cubic-bezier(.34,1.35,.5,1); }
  .ends { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; font-weight: 700; font-size: clamp(14px, 4vw, 17px); }
  .ends span { max-width: 48%; }
  #leftLabel { color: var(--left); }
  #rightLabel { color: var(--right); text-align: right; }
  #valueText { text-align: center; font-size: clamp(30px, 10vw, 44px); font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .message { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    font-size: 16px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .message:empty { display: none; }
  .note { margin-top: 16px; font-size: 13px; color: #fbbf24; text-align: center; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Live Gauge</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Loading…</span></div>

  <div class="gauge-card">
    <svg viewBox="0 0 300 180" role="img" aria-labelledby="valueText">
      <defs>
        <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" id="stopLeft" stop-color="#3b82f6"/>
          <stop offset="50%" stop-color="#9aa3b2"/>
          <stop offset="100%" id="stopRight" stop-color="#ef4444"/>
        </linearGradient>
      </defs>
      <path d="M30 160 A120 120 0 0 1 270 160" fill="none" stroke="url(#arcGrad)" stroke-width="22" stroke-linecap="round"/>
      <g id="ticks"></g>
      <g id="needle">
        <polygon points="146,160 154,160 150,48" fill="#f2f4f8"/>
        <circle cx="150" cy="160" r="11" fill="#f2f4f8"/>
        <circle cx="150" cy="160" r="4" fill="#0f1115"/>
      </g>
    </svg>
    <div class="ends"><span id="leftLabel"></span><span id="rightLabel"></span></div>
    <div id="valueText"></div>
  </div>

  <div class="message" id="message"></div>
  <div class="note" id="note" hidden></div>
  <footer>Updates automatically — no need to refresh.</footer>
</main>

<script>
  // ============================================================
  // SETUP: paste your Google Sheet "Publish to web" CSV link here
  // ============================================================
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTfdwirBohmjqQ8LR_VHOGQ86HUGmcQoFjvO6CBCZ3KyClllfyb8LmwKnbxL96wfEynPt5rdkGcH3Sk/pub?gid=0&single=true&output=csv";

  const CHECK_EVERY_SECONDS = 30;

  // ------------------------------------------------------------
  const params = new URLSearchParams(location.search);
  const sheetUrl = params.get("sheet") || SHEET_CSV_URL;
  const configured = /^https?:\/\//.test(sheetUrl);

  const $ = id => document.getElementById(id);

  // Tick marks every 10%
  (function drawTicks() {
    const g = $("ticks");
    for (let i = 0; i <= 10; i++) {
      const a = Math.PI - (i / 10) * Math.PI;
      const r1 = i % 5 === 0 ? 94 : 100, r2 = 106;
      const x1 = 150 + r1 * Math.cos(a), y1 = 160 - r1 * Math.sin(a);
      const x2 = 150 + r2 * Math.cos(a), y2 = 160 - r2 * Math.sin(a);
      const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
      l.setAttribute("x1", x1); l.setAttribute("y1", y1);
      l.setAttribute("x2", x2); l.setAttribute("y2", y2);
      l.setAttribute("stroke", "#5b6475");
      l.setAttribute("stroke-width", i % 5 === 0 ? 3 : 1.5);
      l.setAttribute("stroke-linecap", "round");
      g.appendChild(l);
    }
  })();

  // Small CSV parser that handles quotes, commas and line breaks inside cells
  function parseCSV(text) {
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  // Column A = setting name, column B = value
  function toSettings(rows) {
    const s = {};
    for (const r of rows) {
      const key = (r[0] || "").trim().toLowerCase().replace(/[^a-z]/g, "");
      if (key) s[key] = (r[1] || "").trim();
    }
    return s;
  }

  function isColor(v) { return /^#[0-9a-f]{3,8}$/i.test(v) || /^[a-z]+$/i.test(v); }

  let lastValue = null;
  function render(s) {
    $("title").textContent = s.title || "Live Gauge";
    document.title = s.title || "Live Gauge";
    $("leftLabel").textContent = s.leftlabel || "";
    $("rightLabel").textContent = s.rightlabel || "";

    if (s.leftcolor && isColor(s.leftcolor)) {
      document.documentElement.style.setProperty("--left", s.leftcolor);
      $("stopLeft").setAttribute("stop-color", s.leftcolor);
    }
    if (s.rightcolor && isColor(s.rightcolor)) {
      document.documentElement.style.setProperty("--right", s.rightcolor);
      $("stopRight").setAttribute("stop-color", s.rightcolor);
    }

    let v = parseFloat(String(s.value || "").replace(/[^0-9.\-]/g, ""));
    if (isNaN(v)) v = 50;
    v = Math.max(0, Math.min(100, v));
    if (v !== lastValue) {
      $("needle").style.transform = `rotate(${-90 + v * 1.8}deg)`;
      lastValue = v;
    }
    const show = (s.shownumber || "yes").toLowerCase();
    $("valueText").textContent = show.startsWith("n") ? "" : `${Math.round(v * 10) / 10}`;
    $("message").textContent = s.message || "";
  }

  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  let failures = 0;
  async function check() {
    try {
      const sep = sheetUrl.includes("?") ? "&" : "?";
      const res = await fetch(sheetUrl + sep + "_=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      if (/^\s*</.test(text)) throw new Error("Not a CSV link");
      render(toSettings(parseCSV(text)));
      failures = 0;
      $("dot").classList.remove("stale");
      $("statusText").textContent = "Live · checked " + timeNow();
      $("note").hidden = true;
    } catch (e) {
      failures++;
      $("dot").classList.add("stale");
      $("statusText").textContent = "Reconnecting…";
      if (failures >= 2) {
        $("note").hidden = false;
        $("note").textContent = "Couldn't reach the latest numbers. Still trying — what you see may be out of date.";
      }
    }
  }

  if (configured) {
    check();
    setInterval(check, CHECK_EVERY_SECONDS * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  } else {
    // Demo mode until the sheet link is pasted in
    render({ title: "Live Gauge (demo)", value: "62", leftlabel: "Left side", rightlabel: "Right side",
             message: "Demo mode — paste your Google Sheet link into SHEET_CSV_URL to go live." });
    $("dot").classList.add("stale");
    $("statusText").textContent = "Not connected to a sheet yet";
  }
</script>
</body>
</html>
